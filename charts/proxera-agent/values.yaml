image:
  registry: ghcr.io
  repository: wenisch-tech/proxera-agent
  tag: ""
  pullPolicy: IfNotPresent

replicaCount: 1

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 64Mi

config:
  serverUrl: ""
  logLevel: info
  heartbeatInterval: 30s
  heartbeatTimeout: 10s
  reconnectBase: 1s
  reconnectMax: 60s
  requestTimeout: 30s
  concurrencyLimit: 100

# Provide the API key value directly — the chart will create a Secret for it.
# If apiKeySecret.name is set, that existing Secret is used instead and apiKey is ignored.
apiKey: ""

apiKeySecret:
  name: ""
  key: PROXERA_API_KEY

serviceAccount:
  create: true
  name: ""
