apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "proxera-client.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "proxera-client.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "proxera-client.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "proxera-client.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ include "proxera-client.serviceAccountName" . }}
      containers:
        - name: proxera-client
          image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ default .Chart.AppVersion .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: PROXERA_SERVER_URL
              value: {{ .Values.config.serverUrl | quote }}
            - name: PROXERA_LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: PROXERA_HEARTBEAT_INTERVAL
              value: {{ .Values.config.heartbeatInterval | quote }}
            - name: PROXERA_HEARTBEAT_TIMEOUT
              value: {{ .Values.config.heartbeatTimeout | quote }}
            - name: PROXERA_RECONNECT_BASE
              value: {{ .Values.config.reconnectBase | quote }}
            - name: PROXERA_RECONNECT_MAX
              value: {{ .Values.config.reconnectMax | quote }}
            - name: PROXERA_REQUEST_TIMEOUT
              value: {{ .Values.config.requestTimeout | quote }}
            - name: PROXERA_CONCURRENCY_LIMIT
              value: {{ .Values.config.concurrencyLimit | quote }}
            - name: PROXERA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ required "apiKeySecret.name is required" .Values.apiKeySecret.name }}
                  key: {{ .Values.apiKeySecret.key | quote }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
