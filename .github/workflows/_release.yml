name: Release

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      tag:
        required: true
        type: string
      changelog:
        required: true
        type: string
      image:
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Setup yq
        uses: mikefarah/yq@v4.44.2

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: release
          pattern: proxera-agent-*
          merge-multiple: true

      - name: Flatten release files
        run: |
          find release -type f -name 'proxera-agent-*' -exec cp {} release/ \;

      - name: Generate checksums
        run: |
          cd release
          sha256sum proxera-agent-* > SHA256SUMS

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: ./
          output-file: release/proxera-agent-${{ inputs.version }}-sbom.spdx.json
          format: spdx-json

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign binaries
        run: |
          cd release
          for f in proxera-agent-*; do
            cosign sign-blob --yes "$f" --bundle "$f.cosign.bundle"
          done

      - name: Update chart versions
        run: |
          yq -i '.version = "${{ inputs.version }}"' charts/proxera-agent/Chart.yaml
          yq -i '.appVersion = "${{ inputs.version }}"' charts/proxera-agent/Chart.yaml
          yq -i '.image.tag = "${{ inputs.version }}"' charts/proxera-agent/values.yaml

      - name: Update version.go
        run: |
          set -euo pipefail
          cat > src/internal/version/version.go << EOF
package version

var (
	Version   = "${{ inputs.version }}"
	Commit    = "${GITHUB_SHA}"
	BuildDate = "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
)
EOF

      - name: Update CHANGELOG.md
        env:
          CHANGELOG: ${{ inputs.changelog }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          header=$(head -n 3 CHANGELOG.md)
          rest=$(tail -n +4 CHANGELOG.md)
          {
            printf '%s\n\n' "$header"
            printf '## %s\n\n' "$TAG"
            printf '%s\n\n' "$CHANGELOG"
            printf '%s\n' "$rest"
          } > CHANGELOG.tmp
          mv CHANGELOG.tmp CHANGELOG.md

      - name: Commit release files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md charts/proxera-agent/Chart.yaml charts/proxera-agent/values.yaml src/internal/version/version.go
          git commit -m "chore(release): ${{ inputs.tag }} [skip ci]" || exit 0
          git push

      - name: Package Helm chart
        run: |
          mkdir -p release
          helm package charts/proxera-agent --destination release

      - name: Sign Helm chart
        run: |
          cd release
          cosign sign-blob --yes proxera-agent-${{ inputs.version }}.tgz --bundle proxera-agent-${{ inputs.version }}.tgz.cosign.bundle

      - name: Publish chart to jfwenisch/charts
        env:
          GITHUBTOKEN: ${{ secrets.GITHUBTOKEN }}
        run: |
          git clone "https://${GITHUBTOKEN}@github.com/jfwenisch/charts.git" charts-repo
          mkdir -p charts-repo/proxera-agent
          cp release/proxera-agent-${{ inputs.version }}.tgz charts-repo/proxera-agent/
          cp release/proxera-agent-${{ inputs.version }}.tgz.cosign.bundle charts-repo/proxera-agent/ 2>/dev/null || true
          cd charts-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Add proxera-agent-${{ inputs.version }}" || echo "No chart changes to commit"
          git push "https://${GITHUBTOKEN}@github.com/jfwenisch/charts.git" main

      - name: Create release notes file
        run: |
          cat > release-notes.md << 'EOF'
          ## Container image
          ${{ inputs.image }}:${{ inputs.version }}

          ## Binaries
          - proxera-agent-linux-amd64
          - proxera-agent-linux-arm64
          - proxera-agent-windows-amd64.exe
          - proxera-agent-windows-arm64.exe

          ## Verify checksums
          ```bash
          sha256sum -c SHA256SUMS
          ```

          ## Changelog
          ${{ inputs.changelog }}
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          name: Release ${{ inputs.tag }}
          body_path: release-notes.md
          files: |
            release/proxera-agent-linux-amd64
            release/proxera-agent-linux-arm64
            release/proxera-agent-windows-amd64.exe
            release/proxera-agent-windows-arm64.exe
            release/SHA256SUMS
            release/proxera-agent-${{ inputs.version }}-sbom.spdx.json
            release/proxera-agent-linux-amd64.cosign.bundle
            release/proxera-agent-linux-arm64.cosign.bundle
            release/proxera-agent-windows-amd64.exe.cosign.bundle
            release/proxera-agent-windows-arm64.exe.cosign.bundle
            release/proxera-agent-${{ inputs.version }}.tgz
            release/proxera-agent-${{ inputs.version }}.tgz.cosign.bundle
